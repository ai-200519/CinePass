services:
  backend:
    build:
      context: ./backend
    container_name: cinepass-backend
    env_file:
      - ./backend/.env
    ports:
      - "3000:3000"
    volumes:
      # Hot reload — mount src for development
      - ./backend/src:/app/src
      # Persist assets
      - ./backend/assets:/app/assets
    restart: unless-stopped      

  front:
    build:
      context: ./front
    container_name: cinepass-front
    ports:
      - "8081:80"
    depends_on:
      - backend
    restart: unless-stopped

  stripe-cli:
    image: stripe/stripe-cli:latest
    container_name: cinepass-stripe
    env_file:
      - ./backend/.env
    command: >
      listen
      --api-key ${STRIPE_SECRET_KEY}
      --forward-to backend:3000/api/paiement/webhook
      --skip-verify
    depends_on:
      - backend
    restart: unless-stopped    
