services:
  backend:
    build:
      context: ./backend
    container_name: cinepass-backend
    env_file:
      - ./backend/.env
    ports:
      - "3000:3000"

  front:
    build:
      context: ./front
    container_name: cinepass-front
    ports:
      - "8081:80"
    depends_on:
      - backend
