server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Serve static assets directly
  location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # For everything else, fall back to index.html (React Router SPA)
  location / {
    try_files $uri $uri/ /index.html;
  }
}
